# Astraeus Governed Postgres MCP: example policy (default deny).
# Names must match the real Postgres catalogue names (lower case unless quoted at creation).
version: 1

# Name of the environment variable that holds the connection string.
# The value is read from the environment only. Never put it in this file.
connection_env: DATABASE_URL

# Read-only. This must be true.
readonly: true

defaults:
  max_rows: 100              # hard cap on rows returned per query
  statement_timeout_ms: 5000 # applied per query inside a READ ONLY transaction
  limit_mode: clamp          # clamp: lower an over-large LIMIT to max_rows. refuse: reject it.
  require_limit: false       # true: queries with no LIMIT are rejected instead of capped
  max_join_tables: 4         # tables allowed in one JOIN query (same schema only). 1 switches joins off.

allow:
  schemas: [public]
  tables:
    - name: customers
      # Only these columns can be selected, filtered or sorted. "email" is absent, so it is denied.
      columns: [id, name, created_at, billing_phone]
      # ANDed into every query on this table. The DB role needs SELECT on deleted_at too.
      require_predicate: "deleted_at IS NULL"
    - name: orders
      columns: [id, customer_id, total_cents, status, created_at]
      max_rows: 50           # optional per-table cap

pii_mask:
  # Applied to any output column that is, or is built from, a column whose name matches.
  # Masked columns also cannot be used in WHERE, GROUP BY, HAVING or ORDER BY.
  patterns:
    - column_regex: "(?i)email|phone|iban"
      strategy: redact       # redact | null | hash (hash is unsalted, so weak for low-entropy values)

# Named views: fixed, pre-approved SQL with typed parameters, called with the run_view tool.
# $1..$n map in order to params. Each view is checked by the same guard when the policy
# loads (allowlists, predicates, masks, row cap); a view the guard would deny stops startup.
# Parameter types: text, integer, numeric, boolean, date, timestamp.
views:
  - name: revenue_by_status
    description: Order count and total by status since a date.
    sql: >-
      select status, count(*) as orders, sum(total_cents) as total_cents
      from orders where created_at >= $1 group by status order by status
    params:
      - { name: since, type: date, description: "Inclusive start date (YYYY-MM-DD)" }
  - name: customer_orders
    description: Orders for one customer, with the contact number masked.
    sql: >-
      select c.name, c.billing_phone as contact, o.total_cents, o.status
      from customers c join orders o on o.customer_id = c.id
      where c.id = $1 order by o.id
    params:
      - { name: customer_id, type: integer }

# Documentation of what the guard refuses. The guard enforces these unconditionally.
deny_sql:
  - multi_statement
  - copy
  - set_role
  - create
  - alter
  - drop
  - insert
  - update
  - delete
  - truncate
  - grant
  - revoke

# Optional. The ASTRAEUS_AUDIT_PATH environment variable overrides path.
audit:
  path: ./astraeus-audit.jsonl
  rotate:
    max_bytes: 10485760      # rotate before the live file passes 10 MiB (minimum 1024)
    daily: true              # also rotate when the UTC date changes
    keep: 30                 # keep the 30 newest rotated files; omit to keep all
